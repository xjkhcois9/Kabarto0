                display:none;

    <script>
        function updateTotalPrice() {
            let total = 0;
            document.querySelectorAll('.food-card').forEach(card => {
                const price = parseInt(card.getAttribute('data-price')) || 0;
                const qty = parseInt(card.querySelector('.qty-count').textContent) || 0;
                total += price * qty;
            });
            document.getElementById('totalPrice').textContent = total.toLocaleString('ar-IQ') + ' د.ع';

            // إظهار/إخفاء تحذير الحد الأدنى
            const warning = document.getElementById('minOrderWarning');
            warning.style.display = (total > 0 && total < 2000) ? 'block' : 'none';
        }

        function changeQty(btn, change) {
            const card = btn.closest('.food-card');
            const qtySpan = card.querySelector('.qty-count');
            let qty = parseInt(qtySpan.textContent) + change;

            if (qty < 0) qty = 0;
            qtySpan.textContent = qty;

            if (qty > 0) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }

            updateTotalPrice();
        }

        function resetQty(btn) {
            const card = btn.closest('.food-card');
            const qtySpan = card.querySelector('.qty-count');
            qtySpan.textContent = 0;
            card.classList.remove('selected');

            updateTotalPrice();
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }


        async function sendOrder() {
            let items = [];
            let totalPrice = 0;

            document.querySelectorAll('.food-card').forEach(card => {
                const qty = parseInt(card.querySelector('.qty-count').textContent) || 0;
                const price = parseInt(card.getAttribute('data-price')) || 0;
                if (qty > 0) {
                    items.push({
                        name: card.getAttribute('data-name'),
                        quantity: qty,
                        price: price
                    });
                    totalPrice += price * qty;
                }
            });

            if (items.length === 0) {
                alert("⚠️ يرجى اختيار صنف واحد على الأقل قبل إرسال الطلب.");
                return;
            }

            if (totalPrice < 2000) {
                document.getElementById('minOrderWarning').style.display = 'block';
                document.getElementById('minOrderWarning').scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            // حفظ الطلب مؤقتاً والانتقال لصفحة بيانات الزبون
            sessionStorage.setItem("pendingOrder", JSON.stringify({
                items,
                totalPrice,
                notes: document.getElementById("notes").value.trim()
            }));

            window.location.href = "info.html";
        }
            
    // إظهار رسالة تأكيد للزبون
    const toast = document.getElementById('toast');


        // ===== عرض المنيو مباشرة من صفحة إدارة المنيو (Firestore) =====
        function escapeHtml(str) {
            return (str || "").replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function renderMenuItems(items) {
            const grid = document.getElementById('foodGrid');
            if (!grid) return;

            if (items.length === 0) {
                grid.innerHTML = `<p class="menu-empty">لا توجد أصناف في المنيو حالياً، تحقق لاحقاً 🍽️</p>`;
                updateTotalPrice();
                return;
            }

            // تخزين بيانات الأصناف للوصول إليها عند فتح نافذة التكبير
            window.menuItemsById = {};

            grid.innerHTML = items.map((item, idx) => {
                const itemId = item.id || ('idx_' + idx);
                window.menuItemsById[itemId] = item;

                const price = Number(item.price) || 0;
                const emoji = item.image
                    ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">`
                    : '🍽️';
                const categoryBadge = item.category
                    ? `<span class="food-category">${escapeHtml(item.category)}</span>`
                    : '';

                return `
                <div class="food-card" data-name="${escapeHtml(item.name)}" data-price="${price}" data-id="${escapeHtml(itemId)}">
                    <div class="food-info" onclick="openFoodModal(this)">
                        <div class="food-emoji">${emoji}</div>
                        <div class="food-details">
                            <span class="food-title">${escapeHtml(item.name)}</span>
                            <span class="food-sub">${escapeHtml(item.desc) || ''}</span>
                            <span class="food-price">${price.toLocaleString('ar-IQ')} د.ع</span>
                            ${categoryBadge}
                        </div>
                    </div>
                    <div class="control-box">
                        <div class="quantity-controls">
                            <button class="btn-qty" onclick="changeQty(this, -1)">-</button>
                            <span class="qty-count">0</span>
                            <button class="btn-qty" onclick="changeQty(this, 1)">+</button>
                        </div>
                        <button class="btn-delete" onclick="resetQty(this)" title="حذف الوجبة">🗑️ حذف</button>
                    </div>
                </div>`;
            }).join('');

            updateTotalPrice();
        }

        // ===== نافذة تكبير تفاصيل الوجبة =====
        let currentModalItemId = null;

        function openFoodModal(el) {
            const card = el.closest('.food-card');
            if (!card) return;

            const itemId = card.getAttribute('data-id');
            const item = (window.menuItemsById || {})[itemId];
            if (!item) return;

            currentModalItemId = itemId;

            const price = Number(item.price) || 0;
            const qty = parseInt(card.querySelector('.qty-count').textContent) || 0;

            const imageWrap = document.getElementById('foodModalImageWrap');
            imageWrap.innerHTML = item.image
                ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">`
                : `<span class="food-modal-emoji-large">🍽️</span>`;

            const categoryEl = document.getElementById('foodModalCategory');
            if (item.category) {
                categoryEl.textContent = item.category;
                categoryEl.style.display = 'inline-block';
            } else {
                categoryEl.style.display = 'none';
            }

            document.getElementById('foodModalTitle').textContent = item.name || '';
            document.getElementById('foodModalDesc').textContent = item.desc || '';
            document.getElementById('foodModalPrice').textContent = price.toLocaleString('ar-IQ') + ' د.ع';
            document.getElementById('foodModalQty').textContent = qty;

            document.getElementById('foodModalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeFoodModal() {
            document.getElementById('foodModalOverlay').classList.remove('show');
            document.body.style.overflow = '';
            currentModalItemId = null;
        }

        function modalChangeQty(change) {
            if (!currentModalItemId) return;
            const card = document.querySelector(`.food-card[data-id="${CSS.escape(currentModalItemId)}"]`);
            if (!card) return;

            const qtySpan = card.querySelector('.qty-count');
            let qty = (parseInt(qtySpan.textContent) || 0) + change;
            if (qty < 0) qty = 0;

            qtySpan.textContent = qty;
            card.classList.toggle('selected', qty > 0);
            document.getElementById('foodModalQty').textContent = qty;

            updateTotalPrice();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFoodModal();
        });

        function subscribeToMenu() {
            db.collection("menuItems")
                .onSnapshot(snapshot => {
                    const items = [];
                    snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                    renderMenuItems(items);
                }, error => {
                    console.error("خطأ في تحميل المنيو من Firebase:", error);
                    const grid = document.getElementById('foodGrid');
                    if (grid) grid.innerHTML = `<p class="menu-empty">تعذر تحميل المنيو، تحقق من الاتصال بالإنترنت.</p>`;
                });
        }

        subscribeToMenu();
    </script>


</body>
